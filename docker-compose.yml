services:
  app:
    container_name: zzal-app
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZZAL_HTTP_PORT:-19120}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://zzal:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/zzal
      SERVE_WEB: "1"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - levelup-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zzal
      POSTGRES_USER: zzal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U zzal -d zzal"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:

networks:
  levelup-net:
    external: true
    name: levelup-net
