services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: [.env]
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://zzal:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/zzal
      SERVE_WEB: "1"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zzal
      POSTGRES_USER: zzal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zzal -d zzal"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
