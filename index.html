try{saved=new Set(JSON.parse(localStorage.getItem('zzal.saved')||'[]'));mine=JSON.parse(localStorage.getItem('zzal.mine')||'[]');reported=JSON.parse(localStorage.getItem('zzal.reported')||'{}')}catch{}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>[...MEMES,...EXTRA_MEMES,...EXTRA_MEMES_2,...EXTRA_MEMES_3,...EXTRA_MEMES_4,...EXTRA_MEMES_5,...EXTRA_MEMES_6,...mine];
const title=z=>z.name;
const isMine=z=>mine.some(m=>m.id===z.id);
const visible=()=>all().filter(z=>!reported[z.id]);
function toast(s){$('toast').textContent=s;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').textContent='',2600)}
function persist(){try{localStorage.setItem('zzal.saved',JSON.stringify([...saved]));return true}catch{toast('브라우저에 저장할 수 없어요. 이 화면에서만 유지됩니다.');return false}}
function navigate(p){current=p;['explore','saved','upload'].forEach(x=>$(x).hidden=x!==p);document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===p);b.setAttribute('aria-current',b.dataset.page===p?'page':'false')});render();window.scrollTo(0,0)}
function card(z){return `<article class="pin"><button class="shot" onclick="openDetail(${z.id})" aria-label="${esc(title(z))} 자세히 보기"><div class="art">${z.art}</div></button><div class="meta"><h3>${esc(title(z))}</h3><button class="save" aria-label="${esc(title(z))} ${saved.has(z.id)?'저장 취소':'저장'}" aria-pressed="${saved.has(z.id)}" onclick="toggle(${z.id})">${icons.save}</button></div><p class="tags">${z.tags.map(t=>'#'+esc(t)).join(' &nbsp; ' )}</p></article>`}
const ADS=[
 {tone:'',brand:'광고주 자리',headline:'짤 사이에서 자연스럽게 발견되는 브랜드',cta:'광고 문의 →',note:'네이티브 이미지 광고 · 준비 중'},
 {tone:'cool',brand:'스폰서 콘텐츠',headline:'좋아하는 것들 사이에 브랜드를 놓아보세요',cta:'자세히 보기 →',note:'피드형 광고 · 준비 중'},
 {tone:'ink',brand:'프로모션',headline:'스크롤을 멈추게 하는 한 장',cta:'사이트 방문 →',note:'브랜드 캠페인 · 준비 중'}
];
function adCard(i){let a=ADS[i%ADS.length];return `<aside class="pin ad-pin" aria-label="광고 자리"><div class="ad-card"><div class="ad-visual ${a.tone}"><span class="ad-label">광고</span><div class="ad-copy"><small>${a.brand}</small><strong>${a.headline}</strong><span>${a.cta}</span></div></div></div><div class="ad-meta"><strong>${a.brand}</strong><p>${a.note}</p></div></aside>`}
function feedCards(rows){let out=[];rows.forEach((z,i)=>{out.push(card(z));if(i>=5&&(i-5)%12===0)out.push(adCard(Math.floor((i-5)/12)))});return out.join('')}
function empty(t,p){return `<div class="empty"><h3>${t}</h3><p>${p}</p><button onclick="resetFeed();navigate('explore')">짤 둘러보기</button></div>`}
const GENERIC=['짤','밈','움짤','사진','이미지','짤방','움짤들'];
const SYN={'웃긴':['웃김','웃기','개그'],'웃김':['웃긴'],'웃기는':['웃김'],'귀여운':['귀여움','귀여'],'슬픈':['슬픔','우울'],'우울한':['우울'],'화난':['화남','분노','빡침'],'빡친':['빡침','분노'],'짜증나는':['짜증'],'피곤한':['피곤','지침'],'힘든':['힘듦','힘들'],'댕댕이':['강아지'],'멍멍이':['강아지'],'강쥐':['강아지'],'냥이':['고양이'],'고양이':['냥'],'기분좋은':['기분좋음'],'설레는':['설렘'],'황당한':['황당'],'억울한':['억울']};
const STOP=['있어','있나','있는','없나','없어','없는','찾아줘','찾아','보여줘','알려줘','해줘','주세요','같은','관련','느낌','뭐가','뭔가','그런','이런','저런','하는','되는','에서','좀','거','것','때','나오는','나오는거','추천'];
function stem(t){let s=t.replace(/(이랑|에서|으로|한테|에게|처럼|보다|까지|부터|랑|은|는|이|가|을|를|의|에|도|만|야|아|와|과)$/,'');return s.length>=2&&s!==t?s:null}
function searchTerms(q){let toks=q.split(/\s+/).filter(Boolean).filter(t=>!GENERIC.includes(t)&&!STOP.includes(t));
 if(toks.length>1)toks=toks.filter(t=>t.length>1);
 let out=[];toks.forEach(t=>{let b=t.replace(/(짤|밈|짤방)$/,'');let base=b.length>=2?b:t;out.push(base);
  let st=stem(base);if(st)out.push(st);
  [t,b,base,st].forEach(k=>(SYN[k]||[]).forEach(x=>out.push(x)))});
 return [...new Set(out.filter(Boolean))]}
function score(z,q,terms){let n=z.kw.reduce((s,k)=>s+(k.length>1&&q.includes(k)?2:0),0);
 let name=z.name.toLowerCase(),why=String(z.why||'').replace(/<[^>]*>/g,'').toLowerCase();
 terms.forEach(t=>{if(name.includes(t))n+=4;
  if(z.tags.some(x=>x.toLowerCase().includes(t)))n+=3;
  if(z.kw.some(k=>k.toLowerCase().includes(t)))n+=2;
  if(why.includes(t))n+=1;
  if(z.cat.toLowerCase().includes(t))n+=1});
 return n}
function render(){let q=$('q').value.trim().toLowerCase();let rows=visible().filter(z=>cat==='전체'||z.cat===cat);if(q){let terms=searchTerms(q);if(terms.length)rows=rows.map(z=>({z,n:score(z,q,terms)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).map(x=>x.z)}$('heading').textContent=q?'“'+$('q').value.trim()+'” 검색 결과':cat==='전체'?'오늘, 이 짤 어때요?':cat+' 모아보기';$('summary').textContent=q?rows.length+'개의 짤 · 키워드가 겹치는 순서로 보여드려요':'말로 하기 애매할 때 꺼내 쓰기 좋은 짤 · '+rows.length+'개';$('reset').hidden=!q;$('board').classList.toggle('board',!!rows.length);$('board').innerHTML=rows.length?feedCards(rows):empty('아직 맞는 짤이 없어요','“잠수”, “야근”처럼 짧은 말로 다시 찾아보세요.');let ss=visible().filter(z=>saved.has(z.id));renderReported();renderCount();$('savedheading').textContent='저장한 짤 '+ss.length;$('savedboard').classList.toggle('board',!!ss.length);$('savedboard').innerHTML=ss.length?ss.map(card).join(''):empty('다시 보고 싶은 짤을 저장해보세요','짤 아래 책갈피 버튼을 누르면 여기에 모여요.');document.querySelectorAll('.count').forEach(e=>e.textContent=saved.size||'');document.querySelectorAll('#filters button').forEach(e=>{e.classList.toggle('active',e.textContent===cat);e.setAttribute('aria-pressed',e.textContent===cat)})}
function toggle(id){saved.has(id)?saved.delete(id):saved.add(id);let ok=persist();render();if($('modal').open)detail(id);if(ok)toast(saved.has(id)?'내 짤에 저장했어요':'저장을 취소했어요')}
function query(q){$('q').value=q;cat='전체';navigate('explore')}
function resetFeed(){$('q').value='';cat='전체';render()}
$('search').onsubmit=e=>{e.preventDefault();render()};['전체','리액션','동물','그림','대화·SNS','글·댓글','방송·자막'].forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{cat=c;render()};$('filters').append(b)});
function detail(id){let z=all().find(z=>z.id===id);$('detail').innerHTML=`<div class="detail"><div class="art">${z.art}</div><div class="detailcopy"><p>${esc(z.cat)} · ${z.id<100?'예시 콘텐츠':'내가 추가한 짤'}</p><h2>${esc(title(z))}</h2><p>${z.why}</p><p>${z.tags.map(t=>'#'+esc(t)).join(' ')}</p><div class="actions"><button onclick="toggle(${id})">${saved.has(id)?'저장됨 ✓':'내 짤에 저장'}</button>${z.src?`<button onclick="download(${id})">이미지 내려받기</button>`:`<button onclick="copyText(${id})">문구 복사</button>`}${isMine(z)?`<button class="danger" onclick="askDelete(${id})">삭제</button>`:`<button class="report" onclick="askReport(${id})">신고</button>`}</div><p style="font-size:11px;margin-top:22px">${z.src?'이 브라우저에만 보관한 이미지입니다.':'예시 짤입니다. 문구를 복사해 사용할 수 있어요.'}</p></div></div>`}
const REASONS=['부적절하거나 불쾌한 콘텐츠','저작권을 침해하는 이미지','스팸 또는 광고','제목·설명이 내용과 다름','기타'];
function ask({title,desc,reasons,go,danger,onOk}){$('asktitle').textContent=title;$('askdesc').textContent=desc;
 $('askreasons').hidden=!reasons;$('askreasons').innerHTML=reasons?REASONS.map((r,i)=>`<label><input type="radio" name="reason" value="${esc(r)}"${i?'':' checked'}>${esc(r)}</label>`).join(''):'';
 $('askgo').textContent=go;$('askgo').classList.toggle('danger',!!danger);
 $('ask').onclose=()=>{if($('ask').returnValue==='ok')onOk(reasons?($('ask').querySelector('input[name=reason]:checked')||{}).value:null)};
 $('ask').showModal()}
function askDelete(id){let z=all().find(z=>z.id===id);if(!z)return;
 ask({title:'이 짤을 삭제할까요?',desc:`“${z.name}”을(를) 내 짤에서 완전히 지웁니다. 되돌릴 수 없어요.`,go:'삭제',danger:true,
  onOk:()=>{mine=mine.filter(x=>x.id!==id);saved.delete(id);
   try{localStorage.setItem('zzal.mine',JSON.stringify(mine))}catch{}
   persist();if($('modal').open)$('modal').close();render();toast('짤을 삭제했어요')}})}
function askReport(id){let z=all().find(z=>z.id===id);if(!z)return;
 ask({title:'이 짤을 신고할까요?',desc:`“${z.name}” · 신고한 짤은 내 피드에서 바로 숨겨집니다. 내 짤 화면에서 다시 꺼낼 수 있어요.`,reasons:true,go:'신고하기',
  onOk:r=>{reported[id]={reason:r||'기타',at:Date.now()};
   try{localStorage.setItem('zzal.reported',JSON.stringify(reported))}catch{}
   if($('modal').open)$('modal').close();render();toast('신고했어요. 피드에서 숨겼습니다')}})}
function unreport(id){delete reported[id];
 try{localStorage.setItem('zzal.reported',JSON.stringify(reported))}catch{}
 render();toast('다시 피드에 표시합니다')}
function renderCount(){$('footcount').textContent=`콘텐츠 ${visible().length}개 · 검색은 키워드 기준`}
function renderReported(){let ids=Object.keys(reported).map(Number).filter(id=>all().some(z=>z.id===id));
 $('reportedbox').hidden=!ids.length;if(!ids.length)return;
 let rows=ids.map(id=>{let z=all().find(z=>z.id===id);return `<div class="reportedrow"><div><strong>${esc(title(z))}</strong><small>${esc(reported[id].reason||'기타')}</small></div><button onclick="unreport(${id})">숨김 해제</button></div>`}).join('');
 $('reportedbox').innerHTML=`<h3>신고해서 숨긴 짤 ${ids.length}개</h3><p>이 브라우저에서만 숨겨집니다. 잘못 눌렀다면 아래에서 되돌릴 수 있어요.</p><div class="reportedlist">${rows}</div>`}
function openDetail(id){detail(id);$('modal').showModal()}
$('modal').addEventListener('click',e=>{if(e.target===$('modal')){let r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});
async function copyText(id){let z=all().find(z=>z.id===id),d=document.createElement('div');d.innerHTML=z.art;let t=d.innerText;try{await navigator.clipboard.writeText(t);toast('문구를 복사했어요')}catch{let a=document.createElement('textarea');a.value=t; $('detail').append(a);a.select();let ok=document.execCommand('copy');a.remove();toast(ok?'문구를 복사했어요':'복사하지 못했어요. 짤의 문구를 직접 선택해주세요.')}}
function download(id){let z=all().find(z=>z.id===id);let a=document.createElement('a');a.href=z.src;a.download=z.filename||'내짤.png';a.click()}
function validate(){$('submit').disabled=!(draft&&$('desc').value.trim()&&$('rights').checked)}
function cancelDraft(){draft=null;$('file').value='';$('draft').hidden=true;$('drop').hidden=false;validate()}
async function readFile(f){if(!['image/jpeg','image/png','image/gif'].includes(f.type)){toast('JPG, PNG, GIF 파일을 선택해주세요');return}if(f.size>10*1024*1024){toast('10MB 이하의 이미지를 선택해주세요');return}let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{draft={src:r.result,filename:f.name};$('preview').src=r.result;$('draft').hidden=false;$('drop').hidden=true;validate()};im.onerror=()=>toast('이미지를 읽을 수 없어요. 다른 파일을 선택해주세요');im.src=r.result};r.onerror=()=>toast('파일을 읽지 못했어요');r.readAsDataURL(f)}
$('file').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0])};$('desc').oninput=validate;$('rights').onchange=validate;['dragover','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();if(t==='drop'&&e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])}));
$('uploadform').onsubmit=e=>{e.preventDefault();if(!draft||!$('desc').value.trim()||!$('rights').checked)return;let name=$('desc').value.trim();let z={...draft,id:Date.now(),name,cat:'직접 올림',tags:['직접 올림'],kw:name.split(/\s+/),why:esc(name),art:`<img src="${draft.src}" alt="${esc(name)}">`};try{localStorage.setItem('zzal.mine',JSON.stringify([...mine,z]))}catch{toast('브라우저 저장 공간이 부족해요. 더 작은 이미지를 선택해주세요.');return}mine.push(z);saved.add(z.id);persist();cancelDraft();$('uploadform').reset();navigate('saved');toast('내 짤에 추가했어요')};render();
</script></body></html>
