# Shared Lightsail Nginx must be attached to levelup-net.
# Public requests go to zzal-web; that container proxies /api/ to zzal-backend.
# HTTPS certificate must exist before enabling the 443 server.
server {
    listen 80;
    server_name zzal.ashwoodfriends.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name zzal.ashwoodfriends.com;

    ssl_certificate /etc/letsencrypt/live/zzal.ashwoodfriends.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zzal.ashwoodfriends.com/privkey.pem;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 15m;

    location / {
        set $zzal_web zzal-web:80;
        proxy_pass http://$zzal_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
