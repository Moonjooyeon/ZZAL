# Use this before the zzal.ashwoodfriends.com TLS certificate exists.
# Replace with zzal.conf after issuing the certificate through the shared Certbot setup.
server {
    listen 80;
    server_name zzal.ashwoodfriends.com;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $zzal_web zzal-web:80;
        proxy_pass http://$zzal_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
